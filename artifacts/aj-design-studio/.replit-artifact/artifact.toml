kind = "web"
previewPath = "/"
title = "A&J Design Studio"
version = "1.0.0"
id = "artifacts/aj-design-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24812

[services.development]
run = "pnpm --filter @workspace/aj-design-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aj-design-studio", "run", "build" ]
publicDir = "artifacts/aj-design-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24812"
BASE_PATH = "/"
